
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Brother's Burden</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Georgia, "Times New Roman", serif;
            color: #f5eee4;
            background:
                radial-gradient(ellipse at top, #293c58, transparent 65%),
                linear-gradient(135deg, #080d19, #101b30, #080d19);
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 25px 8%;
            display: flex;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
            color: #d7b98b;
            letter-spacing: 2px;
            font-size: 12px;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 50px 20px;
        }

        .eyebrow {
            color: #d7b98b;
            letter-spacing: 5px;
            font-size: 12px;
            margin-bottom: 25px;
        }

        h1 {
            font-size: clamp(42px, 8vw, 78px);
            font-weight: normal;
            line-height: 1.15;
        }

        .divider {
            width: 75px;
            height: 1px;
            background: #d7b98b;
            margin: 28px auto;
        }

        .subtitle {
            max-width: 500px;
            color: #c0c9d7;
            font-size: 17px;
            line-height: 1.8;
            font-style: italic;
            margin-bottom: 38px;
        }

        .buttons {
            width: min(300px, 100%);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            padding: 17px 20px;
            border: 1px solid #bba078;
            background: rgba(20, 34, 55, 0.75);
            color: #f5eee4;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 13px;
            transition: 0.3s;
        }

        .btn:hover {
            background: #d7b98b;
            color: #101522;
            transform: translateY(-3px);
        }

        .btn.primary {
            background: #d7b98b;
            color: #101522;
        }

        .btn.primary:hover {
            background: #f0d5a8;
        }

        footer {
            text-align: center;
            padding: 22px;
            font-size: 11px;
            letter-spacing: 2px;
            color: #8490a3;
        }
    </style>
</head>
<body>

    <header>
        <span>A BROTHER'S BURDEN</span>
        <span>A STORY OF LOVE & SACRIFICE</span>
    </header>

    <main>
        <p class="eyebrow">SOME SACRIFICES GO UNSEEN</p>

        <h1>A Brother's<br>Burden</h1>

        <div class="divider"></div>

        <p class="subtitle">
            "Sometimes, the strongest person in the family
            is the one who suffers in silence."
        </p>

        <nav class="buttons">
            <a href="author.html" class="btn">01 — Author</a>
            <a href="reference.html" class="btn">02 — References</a>
            <a href="story.html" class="btn primary">03 — Read the Story</a>
        </nav>
    </main>

    <footer>
        AN ORIGINAL INTERPRETATION OF FAMILY, PAIN, AND HOPE
    </footer>

</body>
</html>
